name: Agent stack
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.config/ai/shared/claude.json'
      - '.config/ai/shared/codex.toml'
      - 'docs/agent-stack/**'
      - '.github/workflows/agent-stack.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python .agents/scripts/check.py
      - run: python -m unittest discover -s .agents/tests -v
