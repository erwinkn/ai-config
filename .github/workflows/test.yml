name: Test configuration tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: .config/ai/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .config/ai
      - run: bash -n .config/ai/bin/setup-unix .config/ai/bin/setup-macos
      - run: npm test
        working-directory: .config/ai
