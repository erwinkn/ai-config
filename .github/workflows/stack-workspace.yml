name: Agent stack workspace
on:
  push:
    branches: [feat/unified-agent-stack-v5]
    paths: [.github/workflows/stack-workspace.yml, .stack-build.py]
permissions:
  contents: write
concurrency:
  group: isolated-stack-build
  cancel-in-progress: false
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate when supplied
        run: |
          if [ -f .stack-build.py ]; then
            python .stack-build.py
            python .agents/scripts/check.py --base d7a1a8c63f89fd9ba63edfd72330ae929489d3ab
            python -m unittest discover -s .agents/tests -v
            (cd .config/ai && npm ci && npm test)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .agents .claude .codex .config/ai/shared/claude.json .config/ai/shared/codex.toml docs/agent-stack
            git rm -- .stack-build.py .stack-core.py .stack-render.py .stack-check.py .stack-record.py .stack-tests.py .stack-lead.md .stack-execution.md .stack-readme.md
            git diff --cached --exit-code d7a1a8c63f89fd9ba63edfd72330ae929489d3ab -- .cursor .cursor-plugin .config/ai/shared/harnesses/cursor.json
            git commit -m 'feat: replace non-Cursor setup with the unified agent stack'
            git push origin HEAD:feat/unified-agent-stack-v5
          fi
      - name: Export checkout
        run: git archive --format=tar HEAD > /tmp/ai-config-workspace.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ai-config-workspace
          path: /tmp/ai-config-workspace.tar
          retention-days: 3
