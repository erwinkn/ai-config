model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
model_verbosity = "low"
model_reasoning_summary = "concise"
plan_mode_reasoning_effort = "xhigh"
sandbox_mode = "danger-full-access"
service_tier = "fast"
suppress_unstable_features_warning = true
web_search = "live"

[agents]
max_concurrent_threads_per_session = 10

[desktop]
composerEnterBehavior = "cmdIfMultiline"
followUpQueueMode = "steer"
git-create-pull-request-as-draft = false
keepRemoteControlAwakeWhilePluggedIn = true
notifications-permissions-enabled = true
notifications-turn-mode = "unfocused"
preventSleepWhileRunning = true
reviewDelivery = "detached"
show-context-window-usage = true
dock-icon-preference = "app-default"
conversationDetailMode = "STEPS_COMMANDS"
git-show-sidebar-pr-icons = true
realtimeVoiceScreenContextEnabled = true
enabled-reasoning-efforts = [ "low", "medium", "high", "xhigh", "ultra", "max" ]
computerUseAlwaysHidePictureInPicture = true
git-pull-request-merge-method = "squash"
appshotSoundEnabled = false

[features]
apps = true
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
in_app_browser = false
multi_agent = true
personality = true
plugins = true
realtime_conversation = true
shell_snapshot = true
unified_exec = true
memories = true
prevent_idle_sleep = true
default_mode_request_user_input = true
computer_use = true
hooks = true

[mcp_servers.executor]
url = "https://executor.erwinkn.com/mcp"
auth = "oauth"
oauth_resource = "https://executor.erwinkn.com/mcp"

[plugins."coderabbit@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."vercel@openai-curated"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true
